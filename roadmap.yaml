steps:
- id: brain-01
  system: brain
  phase: brain-P1
  mode: couch
  title: Hardware Simulator Toolchain & Golden RISC-V Reference Emulator
  deliverables:
  - systems/brain/scripts/setup_tools.sh (installs Verilator digital simulator, Yosys/nextpnr FPGA compiler, Icarus,
    and pytest/cocotb in .tools/)
  - systems/brain/sim/oracle.py (instruction-by-instruction Python reference CPU emulator supporting RV32IM
    integer/multiply, machine-mode control registers Zicsr, CLINT timer, UART console & custom mac instruction)
  - systems/brain/tb/test_oracle.py (unit tests covering arithmetic, branches, memory loads/stores, interrupt traps
    & custom mac)
  verification: uv run --with pytest --with pytest-cov pytest --cov=systems/brain/sim --cov-report=term-missing --cov-fail-under=95 systems/brain/tb/test_oracle.py && which verilator yosys nextpnr-himbaechel
  first_principles: Instruction bit-field decoding, architectural CPU state (Program Counter + 32 registers + Control/Status
    Registers), two's complement arithmetic & comparing real hardware against a golden software oracle
  reference_reading: Harris & Harris (RISC-V Ed.), Ch. 6
  status: in_review
  pr_url: null
  commit: null
  approved_date: null
- id: brain-02
  system: brain
  phase: brain-P1
  mode: couch
  title: 32-Bit Combinational Arithmetic Logic Unit (ALU) & Single-Cycle Bit Shifter
  deliverables:
  - systems/brain/rtl/core/alu.sv
  - systems/brain/tb/test_alu.py (Cocotb + Verilator exhaustive edge-case & randomized property testbench)
  verification: make -C systems/brain/tb MODULE=test_alu
  first_principles: Ripple-carry vs. carry-lookahead addition, arithmetic (sign-preserving) vs. logical right shifts,
    signed (SLT) vs. unsigned (SLTU) comparisons, and stateless always_comb logic-gate synthesis rules
  reference_reading: Harris & Harris (RISC-V Ed.), Ch. 1–2 & 5
  status: pending
  pr_url: null
  commit: null
  approved_date: null
- id: brain-03
  system: brain
  phase: brain-P1
  mode: couch
  title: 32x32 CPU Register File & Instruction Constant Sign-Extender
  deliverables:
  - systems/brain/rtl/core/regfile.sv (dual-port read, clocked write, x0 hardwired zero register)
  - systems/brain/rtl/core/imm_gen.sv (extracts and sign-extends RISC-V I/S/B/U/J constant bit-fields)
  - systems/brain/tb/test_regfile_imm.py
  verification: make -C systems/brain/tb MODULE=test_regfile_imm
  first_principles: Clock-edge flip-flop storage, non-blocking (`<=`) synchronous assignment, why signal propagation
    must beat the clock period (`T_clk >= t_pcq + t_pd + t_setup`), and FPGA lookup-table RAM vs. flip-flop synthesis
  reference_reading: Harris & Harris (RISC-V Ed.), Ch. 3–4
  status: pending
  pr_url: null
  commit: null
  approved_date: null
- id: brain-04
  system: brain
  phase: brain-P1
  mode: couch
  title: Cross-Clock Synchronizer, Clean Reset & 16x-Oversampled Serial Console (UART)
  deliverables:
  - systems/brain/rtl/periph/cdc_sync.sv (two-flip-flop synchronizer preventing half-voltage glitches across unsynchronized
    wires + clean reset bridge)
  - systems/brain/rtl/periph/uart.sv (115200/2M baud serial transmitter/receiver with 16x oversampling & small byte
    FIFO buffers)
  - systems/brain/rtl/uart_echo_top.sv (standalone FPGA bitstream wrapper for Tang Primer 20K)
  - systems/brain/tb/test_uart.py
  verification: make -C systems/brain/tb MODULE=test_uart && yosys -p "read_verilog -sv systems/brain/rtl/periph/cdc_sync.sv
    systems/brain/rtl/periph/uart.sv systems/brain/rtl/uart_echo_top.sv; synth_gowin -top uart_echo_top"
  first_principles: Why reading an asynchronous pin can leave a flip-flop undecided (metastability MTBF), serial
    start/stop byte framing, and sampling each bit 16x to tolerate clock drift
  reference_reading: Harris & Harris (RISC-V Ed.), Ch. 3.5 (Timing & Metastability)
  status: pending
  pr_url: null
  commit: null
  approved_date: null
