    name: 'Phase 1: Brushless Motor Physics & Force-Control Simulation'
  - id: drive-P2
    name: 'Phase 2: 4-Layer 24V Motor-Driver Circuit Board & Factory Launch'
  - id: drive-P3
    name: 'Phase 3: Bare-Metal 20 kHz Current/Force Firmware & Motor Bus Protocol'
  - id: drive-P4
    name: 'Phase 4: 8:1 Gearbox 3D CAD, Stress Analysis & Factory Launch'
  - id: drive-P5
    name: 'Phase 5: Driver Smoke Test, Gearbox Assembly & Torque Bench Verification'
- id: power
  order: 3
  name: Smart Power Distribution, Soft Startup & Electronic Breaker Spine
  role: Surge protector, microsecond electronic circuit breaker & battery fuel gauge protecting all electronics
  workspace: ./systems/power/
  depends_on:
  - drive
  est_weeks: 5–6 weeks
  graduation_demo: Survives massive 12-motor startup surges and intentional dead-shorts in < 5 µs while accurately
    estimating remaining battery charge under load.
