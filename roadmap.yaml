    name: 'Phase 3: Safety Protection Firmware & Live Battery Estimator'
  - id: power-P4
    name: 'Phase 4: Fault-Injection Bring-Up, 150W Load & E-Stop Verification'
- id: limb
  order: 4
  name: 3-Joint Force-Controlled Leg & Tabletop Hopping Stand
  role: 'Masters 3D leg motion & soft impact landings on a desk rail; becomes Front-Left Leg #1'
  workspace: ./systems/limb/
  depends_on:
  - drive
  - power
  est_weeks: 6–7 weeks
  graduation_demo: 'Leg #1 mounted on a compact desk rail floats weightlessly in your hand and hops smoothly on
    its own, driven by code compiled in your C compiler on brain.'
  phases:
