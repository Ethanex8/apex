repository:
  title: 'Apex: Building a Walking Robot Dog From Scratch'
  tagline: Build every layer of a safe, living-room-sized (about 2.5 kg) autonomous robot dog from blank files—your
    own programmable-silicon CPU & 6-layer circuit board (`brain`), force-controlled electric muscles (`drive`),
    smart surge/breaker power board (`power`), single hopping leg (`limb`), simulator-trained 4-legged walker (`walker`),
    and stereo camera eyes (`sight`)—one small, phone-reviewable step at a time.
  robot_class: About 2.5 kg Desktop Research Class (roughly 35 cm long, < 22V touch-safe power, < 2.5 N·m finger-safe
    joints)
  estimated_total_bom_usd: About \$1,495 for robot parts across roughly 12 months (about \$125/mo), plus about \$310–\$540
    for reusable bench tools if needed
safety_guardrails:
- name: Touch-Safe Voltage (< 22V DC)
  description: 'Powered by a 6-cell series lithium-iron-phosphate battery pack (6S LiFePO4: 19.2V nominal, 21.9V
    max), well below the 60V DC shock threshold.'
- name: Stable Battery Chemistry & Current-Limited Bench Power
  description: Lithium-iron-phosphate (LiFePO4) cells resist fire and thermal runaway, and 95% of indoor testing
    runs off a current-limited desk power supply before any battery is ever plugged in.
- name: Finger-Safe Backdrivable Joints (< 2.5 N·m)
  description: At roughly 2.5 kg total weight, every joint can be easily moved by hand when unpowered or compliant,
    runs quietly on carpet, and tests inside a compact tabletop slotted-aluminum frame (no ceiling or doorway drilling).
- name: Zero-Fume Factory Fabrication
  description: External factories handle circuit-board surface-mount soldering (turnkey PCBA) and industrial nylon/aluminum
    printing & milling (MJF/CNC), eliminating solder-paste and high-temp plastic fumes indoors.
phased_procurement:
- stage: 'System 1: brain (Months 1–3)'
  est_cost_usd: \$290
  items: Tang Primer 20K programmable-logic board + snap-in FPGA module (\$45), 8-channel USB waveform analyzer
    (\$15), 2x factory-assembled 6-layer Spine boards (\$115), and LiteVNA 64 radar-like cable/trace tester (\$115)
- stage: Core Bench Instruments (Month 4, 1x if needed)
  est_cost_usd: \$310–\$540
  items: 4-channel 70–100 MHz oscilloscope for fast voltage waveforms (\$160–\$390), 30V/10A current-limited bench
    power supply (\$55), and USB-C soldering iron + multimeter + wire crimpers (\$95)
- stage: 'System 2: drive (Months 4–5)'
  est_cost_usd: \$130
  items: 1x flat pancake brushless motor, contactless magnetic angle chip, bearings, nylon/aluminum gearbox housing,
    and 2x factory-assembled 4-layer motor-driver boards
- stage: 'System 3: power (Month 6)'
  est_cost_usd: \$150
  items: 2x factory-assembled 4-layer power/breaker boards, physical mushroom E-stop button, and 6-cell LiFePO4
    battery + smart charger + fire-safe storage bag
- stage: 'System 4: limb (Months 7–8)'
  est_cost_usd: \$185
  items: 2x extra motors, housings, carbon-fiber leg tubes, timing belts, and tabletop slotted-aluminum linear-rail
    stand
- stage: 'System 5: walker (Months 9–10)'
  est_cost_usd: \$520
  items: 9x motors (\$200), 10x batch motor-driver boards (\$140), and carbon tubes, bearings, milled torso plates
    & tabletop bungee safety frame (\$180)
- stage: 'System 6: sight (Months 11–12)'
  est_cost_usd: \$220
  items: 2x synchronized simultaneous-exposure stereo cameras, compact Linux/neural vision computer, and 3D-printed
    head mount
systems:
- id: brain
  order: 1
  name: Custom CPU on FPGA, 6-Layer Circuit Board, C Compiler & Real-Time OS
  role: Robot spinal cord & walking brain (also works standalone as a custom programmable-chip computer)
  workspace: ./systems/brain/
  depends_on: []
  est_weeks: 10–12 weeks (8–12 hr/wk)
  graduation_demo: 'Boots from persistent Flash into 32 MB dynamic RAM on your custom 6-layer board running your
    own C compiler and Real-Time OS: interactive terminal, rock-steady 1,000 Hz tilt/balance loop (< 2 µs jitter),
    and < 0.6 ms neural walking inference using a custom AI multiply-add instruction.'
  phases:
  - id: brain-P1
    name: 'Phase 1: Simulator Tools, Reference CPU & Digital Building Blocks'
  - id: brain-P2
    name: 'Phase 2: Basic RISC-V CPU, AI Multiplier & Interrupt Handling'
  - id: brain-P3
    name: 'Phase 3: 5-Stage Pipelined Processor & FPGA Timing Closure'
  - id: brain-P4
    name: 'Phase 4: 6-Layer Circuit Board Design & Factory Launch'
  - id: brain-P5
    name: 'Phase 5: External RAM/Flash Controllers & Robot Motor/Sensor Ports'
  - id: brain-P6
    name: 'Phase 6: From-Scratch C Compiler, Assembler & Linker'
  - id: brain-P7
    name: 'Phase 7: Strict-Deadline Real-Time OS & Neural Walking Workload'
  - id: brain-P8
    name: 'Phase 8: Custom 6-Layer Board Smoke Test, Trace-Echo Sweep & Graduation'
- id: drive
  order: 2
  name: Force-Controlled Brushless Motor Driver & 8:1 Gearbox (Electric Muscle)
  role: One finger-safe, hand-backdrivable robotic joint (< 2.5 N·m; 12x used in final robot)
  workspace: ./systems/drive/
  depends_on:
  - brain
  est_weeks: 7–8 weeks
  graduation_demo: A haptic wheel that feels like a programmable spring and shock absorber in your fingers, commanded
