    name: 'Phase 1: 3D Leg Geometry, Force-Torque Mapping & Gravity Compensation'
  - id: limb-P2
    name: 'Phase 2: Physics-Simulator Hopping & Foot-Contact Detection'
  - id: limb-P3
    name: 'Phase 3: Lightweight Leg 3D CAD, Impact Stress Check & Parts Order'
  - id: limb-P4
    name: 'Phase 4: Porting Code to brain, Rail Assembly & Live Hopping'
- id: walker
