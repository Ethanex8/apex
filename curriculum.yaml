home_lab:
  heading: Phased Home-Lab Infrastructure & Safety Protocols
  workbench_blueprint:
    heading: Workbench Tooling Blueprint
    benches:
    - heading: 1. Electronics & SMD Bench (~USD 500–900 phased over curriculum)
      items:
      - label: Oscilloscope
        description: 4-channel 70–100 MHz digital storage oscilloscope (e.g., Rigol DHO804 or Siglent SDS1104X-E).
      - label: Power & Load
        description: 30V/5A programmable dual-channel current-limited DC bench power supply paired with a 150W DC programmable
          electronic load.
      - label: Logic & Debugging
        description: \$15 USB 24 MHz 8-channel logic analyzer (Sigrok/PulseView compatible), hardware ST-Link/JTAG programmer-debuggers,
          and a USB-to-CAN-FD interface adapter.
      - label: Assembly & Soldering
        description: Temperature-controlled soldering iron (Pinecil or Hakko), MHP30 mini reflow hotplate, hot-air SMD rework
          station, stainless steel solder stencils, and Engineer PA-09/PA-24 ratcheting crimp tools for Molex Micro-Fit, JST-GH,
          and XT30 connectors.
    - heading: 2. RF & Metrology Bench (~USD 250 phased in Tier 3)
      items:
      - label: Vector Network Analyzer & Spectrum Analyzer
        description: LiteVNA 64 (50 kHz to 6.3 GHz) with an SMA Open/Short/Load calibration kit (for $S_{11}$ / $S_{21}$ sweeps
          and TDR PCB trace impedance analysis); tinySA Ultra spectrum analyzer (up to 5.3 GHz).
      - label: RF Accessories
        description: 20 dB and 30 dB SMA inline attenuators for direct coaxial cable transmitter verification without unshielded
          radiation.
      - label: Metrology
        description: Digital vernier calipers, 0.01 mm dial indicator with a heavy magnetic base, and a budget USB-C thermal
          camera ( \$150 ) for monitoring thermal boundaries.
    - heading: 3. Mechanical Prototyping Bench (~USD 400–800)
      items:
      - label: Additive Manufacturing
        description: Enclosed CoreXY 3D printer with a hardened steel nozzle capable of extruding engineering filaments (PA-CF,
          PETG-CF, polycarbonate, TPU).
      - label: Hardware Fasteners & Bearings
        description: Heat-set insert press, assortment of metric socket-head screws, ground shoulder bolts, steel dowel pins,
          and thin-section precision ball bearings.
      - label: Mechanical Test Rig
        description: Modular 2020-extrusion frame with an HX711-interfaced 50 kg load cell for destructive tensile/creep coupons
          (MATS 101) and propeller thrust/torque measurements (ME 306).
      - label: Cloud Digital Manufacturing
        description: Turnkey on-demand laser cutting, CNC sheet bending, and 5-axis aluminum milling services (SendCutSend,
          JLCCNC, PCBWay CNC) for 6061-T6 aluminum and 3K carbon-fiber brackets.
  safety_protocols:
    heading: Residential Safety Protocols
    categories:
    - heading: Electrical & Energy Storage Safety
      items:
      - label: SELV Voltage Ceiling
        description: All battery configurations are strictly limited to 6S ( $< 25.2\text{ V}$ ) to maintain all exposed circuits
          and busbars within Safe Extra-Low Voltage (SELV) regulations.
      - label: Current-Limited Bring-Up
        description: Initial hardware bring-up of motor drives, inverters, power distribution boards, and BMS circuits must
          always be conducted using a current-limited bench power supply before connecting live chemistry.
      - label: Battery Storage & Charging Containment
        description: Lithium-based battery packs must be charged and stored inside fiberglass fireproof LiPo bags or sealed
          steel ammo cans.
      - label: Emergency Stop (E-Stop)
        description: An emergency physical mushroom shut-off switch (E-stop) must be wired directly in series with the battery
          pack power feed.
    - heading: Mechanical & Flight Testing Safety
      items:
      - label: Firmware Guardrails
        description: High-torque actuators (Capstone 4), multi-axis arms (Capstone 5), multirotors (Capstone 7), and legged
          platforms (Capstone 8) must be configured with hard software velocity, current, and travel limits in firmware.
      - label: Enclosed Flight Testing
        description: Aerial vehicle dynamic testing must take place strictly indoors inside protective safety netting or tethered
          to the ceiling.
      - label: Overhead Bungee Gantry
        description: Dynamic legged robots must be suspended from an overhead doorway pull-up bar using an elastic bungee
          gantry during all gait bring-up, tuning, and reinforcement learning policy deployments.
