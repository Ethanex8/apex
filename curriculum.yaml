  mermaid_label: 'Tier 3: 300-Level Junior Tracks'
  readme_focus: 'Specialized Tracks:<br>• **Track A**: Processor Microarchitecture, CMOS VLSI, Embedded RTOS, OS Kernels,
    Compilers, Networking & ROS 2<br>• **Track B**: Analog Devices, Sensors & Metrology, DSP, Applied Electromagnetics, RF
    & Microwave Engineering, Power Electronics<br>• **Track C**: Machine Component Design, Mechanical Vibrations, Finite Element
    Analysis (FEA), Fluid Mechanics, Heat Transfer, Rotorcraft Aerodynamics<br>• **Track D**: Lie Groups & Spatial Dynamics,
    Feedback Control, 3D Computer Vision, Factor-Graph SLAM, Digital Control & System ID'
  tracks:
