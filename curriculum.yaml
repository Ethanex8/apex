  mermaid_title: Antenna & Phased Arrays
  tier: 4
  prerequisites:
  - EE 304
  - EE 305
  texts:
  - authors: Warren L. Stutzman & Gary A. Thiele
    title: Antenna Theory and Design (3rd Ed.)
    unit: Ch.
    total_units: 16
    assigned: 1-11, 13
    skipped: 12, 14-16
    scope: Ch. 1–11 and 13; skip Ch. 12 on base-station antennas and Ch. 14–16 on computational electromagnetics
  topics_label: Core Topics
  core_topics: Radiation integrals and auxiliary vector potentials, directivity, gain, effective aperture, Friis transmission
    equation and link budget analysis, linear wire dipoles and monopoles, resonant microstrip patch antenna synthesis, axial
    ratio polarization, two-element and planar phased array factor synthesis, electronic beam steering, and $S_{11}$ return-loss
    / radiation pattern characterization.
- id: EE 402
  node_id: EE402
  title: Digital Wireless Communications & Software-Defined Radio (SDR)
  mermaid_title: Digital Wireless & SDR
  tier: 4
  prerequisites:
  - EE 303
  - EE 305
  - MATH 203
  texts:
  - authors: Michael Rice
    title: 'Digital Communications: A Discrete-Time Approach'
    unit: Ch.
    total_units: 10
    assigned: 1-10
    skipped: ''
    assigned_appendices: A-C
    scope: Ch. 1–10 and Appendices A–C complete
  topics_label: Core Topics
  core_topics: Baseband and passband discrete-time SDR transceiver architectures, root-raised-cosine pulse shaping, intersymbol
    interference (ISI) and eye diagrams, matched filtering, AWGN bit-error-rate (BER) link analysis, BPSK/QPSK/QAM and OFDM
    modulation, Costas loop carrier phase/frequency synchronization, Gardner timing error detector symbol recovery, and frame
    synchronization.
- id: EE 403
  node_id: EE403
  title: Battery Management Systems & Pack Protection
  mermaid_title: Battery Management Systems
  tier: 4
  prerequisites:
  - EE 306
  - ME 305
  - MATH 203
  - ROB 302
  - ROB 304
  texts:
  - authors: Gregory L. Plett
    title: Battery Management Systems
    volumes:
    - volume: Vol. I
      title: Battery Modeling
      unit: Ch.
      total_units: 7
      assigned: 1-2, 7
      skipped: 3-6
      scope: Ch. 1–2 and 7; skip Ch. 3–6 on continuum porous-electrode PDE models
    - volume: Vol. II
      title: Equivalent-Circuit Methods
      unit: Ch.
      total_units: 7
      assigned: 1-7
      skipped: ''
      scope: Ch. 1–7 complete
  topics_label: Core Topics & Lab
  core_topics: Electrochemistry fundamentals, equivalent-circuit cell modeling (Randles models), online Extended/Sigma-Point
    Kalman Filter (EKF/SPKF) State-of-Charge (SoC) and State-of-Health (SoH) estimation, active/passive cell balancing, pre-charge
    circuits, solid-state bidirectional e-fuses, TI BQ769x2 AFE integration, and isolated CAN-FD telematics.
- id: EE 404
  node_id: EE404
  title: Electric Machinery & Field-Oriented Servo Drives
  mermaid_title: Field-Oriented Servo Drives
  tier: 4
  prerequisites:
  - PHYS 102
  - MATH 201
  - EE 306
  - ROB 305
  - ME 301
  texts:
  - authors: Sang-Hoon Kim
    title: 'Electric Motor Control: DC, AC, and BLDC Motors'
    unit: Ch.
    total_units: 10
    assigned: 1-10
    skipped: ''
    scope: Ch. 1–10 complete
  topics_label: Core Topics
  core_topics: Magnetic reluctance and electromechanical energy conversion, reference frame transformations ( $dq0$ Clarke
    and Park transforms), Permanent Magnet Synchronous Machine (PMSM) dynamic equations, Space Vector PWM (SVPWM), inverter
    dead-time compensation, high-bandwidth cascaded current/velocity/position loop tuning, and field-weakening control.
- id: ROB 401
  node_id: ROB401
  title: Nonlinear & Geometric Control
  mermaid_title: Nonlinear & Geometric Control
  tier: 4
  prerequisites:
  - ROB 301
  - ROB 302
  texts:
  - authors: Jean-Jacques E. Slotine & Weiping Li
    title: Applied Nonlinear Control
    unit: Ch.
    total_units: 9
    assigned: 1-9
    skipped: ''
    scope: Ch. 1–9 complete
  topics_label: Core Topics
  core_topics: Phase plane portraits, Lyapunov stability theory, Barbalat's lemma and invariant set theorems, Control Lyapunov
    Functions (CLFs), input-state and input-output feedback linearization, sliding mode control, adaptive manipulator control,
    passivity-based and Cartesian manipulator impedance control, and Lie-group attitude/pose tracking on $\mathrm{SO}(3)$
    and $\mathrm{SE}(3)$ manifolds.
- id: ROB 402
  node_id: ROB402
  title: Algorithmic Motion Planning
  mermaid_title: Algorithmic Motion Planning
  tier: 4
  prerequisites:
  - ROB 301
  - CS 201
  - MATH 203
  - MATH 204
  texts:
  - authors: Steven M. LaValle
    title: Planning Algorithms
    unit: Ch.
    total_units: 15
    assigned: 1-8, 13-14
    skipped: 9-12, 15
    covered_in:
    - ROB 302
    - ROB 401
    scope: Ch. 1–8 and 13–14; skip Ch. 9–12 on POMDP decision-theoretic planning and Ch. 15 on control theory covered in ROB
      302 and ROB 401
  topics_label: Core Topics
  core_topics: Discrete heuristic graph search (A*), configuration space ( $\mathcal{C}$ space) topology and obstacle representations,
    cell decomposition and combinatorial roadmaps, potential fields and navigation functions, sampling-based motion planning
    (Probabilistic Roadmaps / PRM, Rapidly-exploring Random Trees / RRT, asymptotically optimal RRT*, and $k$ -d tree nearest-neighbor
    indexing), differential constraints, and minimum-snap/minimum-jerk spline trajectory smoothing.
- id: ROB 403
  node_id: ROB403
  title: Optimal Control & Model Predictive Control (MPC)
  mermaid_title: Optimal Control & MPC
  tier: 4
  prerequisites:
  - ROB 301
  - ROB 305
  - ROB 401
  - MATH 204
  texts:
  - authors: James B. Rawlings, David Q. Mayne & Moritz M. Diehl
    title: 'Model Predictive Control: Theory, Computation, and Design (2nd Ed.)'
    unit: Ch.
    total_units: 8
    assigned: 1-2, 8
    skipped: 3-7
    scope: Ch. 1–2 and 8; skip Ch. 3–7 on tube-based robust, moving-horizon estimation, output-feedback, distributed, and
      explicit multiparametric MPC
  topics_label: Core Topics
  core_topics: Constrained numerical optimization and Quadratic Programming (QP), finite-horizon and infinite-horizon Linear
    Quadratic Regulators (LQR), iterative LQR (iLQR) and Differential Dynamic Programming (DDP), linear and nonlinear receding-horizon
    Model Predictive Control (MPC), Lyapunov terminal-cost recursive feasibility and stability guarantees, and real-time embedded
    solver deployment (OSQP/acados).
- id: ROB 501
  node_id: ROB501
  title: Underactuated Robotics & Trajectory Optimization
  mermaid_title: Underactuated Robotics
  tier: 5
  prerequisites:
  - ROB 401
  - ROB 403
  texts:
  - authors: Russ Tedrake
    title: 'Underactuated Robotics: Algorithms for Walking, Running, Swimming, Flying, and Manipulation'
    unit: Ch.
    total_units: 21
    assigned: 1-17
    skipped: 18-21
    covered_in:
    - ROB 304
    - ROB 305
    - ROB 503
    scope: Ch. 1–17; skip Ch. 18–19 on system identification and state estimation covered in ROB 304 and ROB 305, and Ch.
      20–21 on policy search and imitation learning covered in ROB 503
  topics_label: Core Topics
  core_topics: Underactuated mechanical systems, acrobot/pendulum swing-up, energy shaping and partial feedback linearization,
    limit cycles, Poincaré maps, hybrid zero dynamics for legged locomotion, centroidal momentum and Zero-Moment Point (ZMP)
    dynamics, contact-implicit planning, and direct transcription/collocation trajectory optimization.
- id: ROB 502
  node_id: ROB502
  title: Deep Learning for Robotic Perception & Visuomotor Policies
  mermaid_title: Deep Learning for Robotics
  tier: 5
  prerequisites:
  - ROB 303
  - MATH 201
  - MATH 203
  texts:
  - authors: Simon J.D. Prince
    title: Understanding Deep Learning
    unit: Ch.
    total_units: 21
    assigned: 1-18
    skipped: 19-21
    covered_in:
    - ROB 503
    scope: Ch. 1–18; skip Ch. 19 on Reinforcement Learning covered in ROB 503 and Ch. 20–21 on theoretical overparameterization
      and AI ethics
  topics_label: Core Topics
  core_topics: Automatic differentiation and backpropagation, stochastic gradient optimization (AdamW), convolutional neural
    networks (CNNs) and residual networks (ResNets), semantic segmentation and 3D point-cloud backbones, self-attention and
    Vision Transformers (ViTs), variational autoencoders, denoising diffusion probabilistic models (DDPMs), and diffusion-based
    visuomotor action policies.
- id: ROB 503
  node_id: ROB503
  title: Reinforcement Learning & Sim-to-Real Control
  mermaid_title: Reinforcement Learning & Sim-to-Real
  tier: 5
  prerequisites:
  - ROB 304
  - ROB 403
  - ROB 502
  texts:
  - authors: Richard S. Sutton & Andrew G. Barto
    title: 'Reinforcement Learning: An Introduction'
    unit: Ch.
    total_units: 17
    assigned: 1-13, 16-17
    skipped: 14-15
    scope: Ch. 1–13 and 16–17; skip Ch. 14–15 on psychology and neuroscience
  topics_label: Core Topics
  core_topics: Finite Markov Decision Processes (MDPs), Bellman expectation and optimality equations, value and policy iteration,
    Monte Carlo and Temporal-Difference (TD) learning, deep Q-networks (DQN), policy gradient theorem, Generalized Advantage
    Estimation (GAE), actor-critic policy gradients (PPO, SAC), parallel GPU physics simulation (Isaac Lab / MuJoCo MJX),
    domain randomization, and Sim-to-Real reinforcement learning transfer.
