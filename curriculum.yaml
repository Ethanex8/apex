    Data Structures & Algorithms, Systems Programming & Low-Level C, Linear Circuits & KiCad EDA, Signals & Systems, SystemVerilog
    RTL, Mechanics of Materials, 3D Analytical & Variational Dynamics, Engineering Thermodynamics
  mermaid_edge_order:
