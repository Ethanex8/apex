repository:
  readme_title: 'Apex: Robotics & Computer Engineering'
  readme_intro: '**Apex** is an open-source, full-stack curriculum and engineering blueprint bridging first-principles theory
    and real-world autonomous hardware. It unifies foundational mathematics, theoretical physics, computer science, electrical
    engineering, and mechanical engineering into a cohesive 5-tier academic sequence paired with 8 physically realizable hardware
    capstone systems.'
  curriculum_title: Robotics & Computer Engineering (RCE) Curriculum
  curriculum_intro: A comprehensive, mathematically rigorous, hands-on curriculum bridging first-principles theory and real-world
    physical systems engineering across 5 academic tiers, 8 hardware capstones, and residential laboratory safety protocols.
  core_pillars:
  - name: First-Principles Rigor
    description: Full coverage of vector calculus, analytical & variational mechanics, electromagnetism, linear algebra, dynamical
      systems, Lie groups ( $\mathrm{SO}(3)$ and $\mathrm{SE}(3)$ ), convex optimization, and optimal control.
  - name: Silicon-to-Software Stack
    description: Spanning transistor physics and CMOS VLSI design up through custom RISC-V CPU pipelining, low-level C systems
      programming, bare-metal RTOS development, POSIX OS kernels, compiler construction, and distributed robotic middleware
      (ROS 2 / DDS).
  - name: Physical System Realization
    description: Hands-on hardware execution across all engineering domains—from 4/6-layer high-speed controlled-impedance
      PCB design, switched-mode power converters, and Field-Oriented Control (FOC) inverter drives to precision cycloidal
      gearboxes, carbon-fiber composite airframes, and multi-sensor spatial SLAM pods.
  - name: Apex Synthesis
    description: System-level convergence into an 8–10 kg, 12-DOF torque-controlled quadruped / wheeled-biped dynamic robot
      integrating all previous subsystems.
  capstones_intro: 'All capstone hardware designs target residential home-lab execution within Safe Extra-Low Voltage ( $<
    25.2\text{ V}$ SELV) boundaries and budget-conscious procurement:'
