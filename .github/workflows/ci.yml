name: Apex CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-python-roadmap-and-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: book/package-lock.json

      - name: Run static AST, Ruff, and ShellCheck quality gate
        run: python3 scripts/check_code.py

      - name: Validate roadmap.yaml, book sync, and textbook anchors
        run: |
          python3 scripts/sync_book.py --check
          python3 scripts/check_book.py
          uv run --with pyyaml python3 scripts/build.py --check

      - name: Build VitePress interactive textbook (strict link & math check)
        env:
          BOOK_BASE: /${{ github.event.repository.name }}/
          GITHUB_REF_NAME: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
        run: |
          npm --prefix book ci
          npm --prefix book run build

      - name: Run headless Chromium visual, Mermaid SVG, and contrast gate
        run: |
          uv run --with playwright playwright install --with-deps chromium
          uv run --with playwright python3 scripts/check_visuals.py --base "/${{ github.event.repository.name }}/"

      - name: Run repo tooling unit tests with >=95% line coverage
        run: >
          PYTHONPATH=scripts uv run --with pytest --with pytest-cov --with pyyaml --with playwright
          pytest -v --cov=code_anchors --cov=sync_book --cov=check_book --cov=check_code
          --cov=check_visuals --cov=harvest_feedback --cov=build --cov=step
          --cov=build_review_plan --cov=chapter_index
          --cov-report=term-missing --cov-fail-under=95 scripts/tests/

      - name: Run brain oracle unit tests with >=95% line coverage
        run: >
          uv run --with pytest --with pytest-cov
          pytest -v --cov=systems/brain/sim --cov-report=term-missing --cov-fail-under=95
          systems/brain/tb/test_oracle.py

