name: Deploy Textbook to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-stage:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: book/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Export PR inline review metadata
        if: github.event_name == 'pull_request'
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO_SLUG: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "${BASE_SHA}" "${HEAD_SHA}" || true
          python3 scripts/export_pr_review_meta.py \
            --pr "${PR_NUM}" \
            --repo "${REPO_SLUG}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --out /tmp/apex-pr-review-meta.json
          echo "APEX_PR_META_FILE=/tmp/apex-pr-review-meta.json" >> "${GITHUB_ENV}"

      - name: Build VitePress textbook
        env:
          BOOK_BASE: ${{ github.event_name == 'pull_request' && format('/{0}/pr-{1}/', github.event.repository.name, github.event.pull_request.number) || format('/{0}/', github.event.repository.name) }}
          GITHUB_REF_NAME: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
        run: |
          npm --prefix book ci
          npm --prefix book run build

      - name: Checkout gh-pages state
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _gh_pages
          fetch-depth: 1

      - name: Update root or PR preview directory on gh-pages
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${IS_PR}" = "true" ]; then
            rm -rf "_gh_pages/pr-${PR_NUM}"
            mkdir -p "_gh_pages/pr-${PR_NUM}"
            cp -a book/.vitepress/dist/. "_gh_pages/pr-${PR_NUM}/"
            COMMIT_MSG="deploy: update PR #${PR_NUM} textbook preview (${GITHUB_SHA::7})"
          else
            find _gh_pages -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'pr-*' -exec rm -rf {} +
            cp -a book/.vitepress/dist/. _gh_pages/
            COMMIT_MSG="deploy: update main textbook (${GITHUB_SHA::7})"
          fi
          touch _gh_pages/.nojekyll
          git -C _gh_pages add -A
          if ! git -C _gh_pages diff --cached --quiet; then
            git -C _gh_pages config user.name "github-actions[bot]"
            git -C _gh_pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C _gh_pages checkout --orphan gh-pages-tmp
            git -C _gh_pages add -A
            git -C _gh_pages commit -m "${COMMIT_MSG}"
            git -C _gh_pages branch -M gh-pages-tmp gh-pages
            git -C _gh_pages push --force origin gh-pages
          fi
          rm -rf _gh_pages/.git

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _gh_pages

  cleanup-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.prune.outputs.changed }}
    steps:
      - name: Checkout gh-pages state
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _gh_pages
          fetch-depth: 1

      - name: Remove closed PR preview directory
        id: prune
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -d "_gh_pages/pr-${PR_NUM}" ]; then
            rm -rf "_gh_pages/pr-${PR_NUM}"
            git -C _gh_pages config user.name "github-actions[bot]"
            git -C _gh_pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C _gh_pages checkout --orphan gh-pages-tmp
            git -C _gh_pages add -A
            git -C _gh_pages commit -m "deploy: remove closed PR #${PR_NUM} preview"
            git -C _gh_pages branch -M gh-pages-tmp gh-pages
            git -C _gh_pages push --force origin gh-pages
            rm -rf _gh_pages/.git
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            rm -rf _gh_pages/.git
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload Pages Artifact
        if: steps.prune.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _gh_pages

  deploy-book:
    needs: [build-and-stage, cleanup-preview]
    if: >-
      always() &&
      !(needs.build-and-stage.result == 'failure' || needs.cleanup-preview.result == 'failure') &&
      (needs.build-and-stage.result == 'success' ||
       (needs.cleanup-preview.result == 'success' && needs.cleanup-preview.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Update sticky PR preview comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- apex-book-preview -->';
            const prNum = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const rootUrl = `https://${owner.toLowerCase()}.github.io/${repo}/`;
            const previewUrl = `${rootUrl}pr-${prNum}/`;
            const isClosed = context.payload.action === 'closed';
            const merged = Boolean(context.payload.pull_request.merged);
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = isClosed
              ? `${marker}\n${merged ? `Merged into \`main\` — live textbook: ${rootUrl}` : 'PR closed — preview removed.'} (preview \`pr-${prNum}\` cleaned up).`
              : `${marker}\nLive PR textbook preview: ${previewUrl} (commit \`${sha}\`, root \`${rootUrl}\` remains \`main\`-only).`;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNum,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNum, body });
            }
